<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robot Dog 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Saira:wght@500;600;700&display=swap">
<style>
  :root {
    /* Layout: full-bleed studio turntable; title block floats top-left, control dock floats bottom-center and wraps on phones */
    --bg: #e6e6e3;
    --bg-hi: #f7f7f5;
    --fg: #1c1d20;
    --muted: #686a70;
    --panel: rgba(255, 255, 255, 0.74);
    --line: rgba(28, 29, 32, 0.12);
    --accent: #3a52c4;
    --on-accent: #ffffff;
    --display: "Saira", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131416;
      --bg-hi: #24262b;
      --fg: #ecedef;
      --muted: #9a9ca4;
      --panel: rgba(30, 31, 35, 0.78);
      --line: rgba(255, 255, 255, 0.1);
      --accent: #95a7ff;
      --on-accent: #10121a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #131416;
    --bg-hi: #24262b;
    --fg: #ecedef;
    --muted: #9a9ca4;
    --panel: rgba(30, 31, 35, 0.78);
    --line: rgba(255, 255, 255, 0.1);
    --accent: #95a7ff;
    --on-accent: #10121a;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    color: var(--fg);
    font-family: var(--display);
    background-color: var(--bg);
    background-image: radial-gradient(ellipse 70% 60% at 50% 45%, var(--bg-hi), var(--bg) 75%);
  }
  .stage { position: fixed; inset: 0; }
  .stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; cursor: grab; }
  .stage canvas:active { cursor: grabbing; }

  .ui {
    position: fixed;
    inset: 0;
    box-sizing: border-box;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 16px;
    pointer-events: none;
  }
  .ui > * { pointer-events: auto; }

  .title { display: flex; flex-direction: column; gap: 6px; max-width: 34ch; align-self: flex-start; }
  .eyebrow {
    margin: 0;
    font: 500 11px/1 var(--mono);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    margin: 0;
    font-size: clamp(28px, 4vw, 40px);
    line-height: 1;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .hint { margin: 0; font: 400 12px/1.5 var(--mono); color: var(--muted); }

  .dock {
    align-self: center;
    max-width: 100%;
    box-sizing: border-box;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px 18px;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .group { display: flex; align-items: center; gap: 8px; }
  .label {
    font: 500 10.5px/1 var(--mono);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .seg { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 9px; }
  button {
    font: 500 13px/1 var(--display);
    color: var(--fg);
    background: transparent;
    border: 0;
    border-radius: 7px;
    padding: 8px 11px;
    cursor: pointer;
  }
  button:hover { background: var(--line); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .toggle { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; }
  .track { width: 26px; height: 14px; border-radius: 99px; background: var(--line); position: relative; transition: background 0.2s; }
  .track::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--fg);
    transition: transform 0.2s;
  }
  .toggle[aria-pressed="true"] .track { background: var(--accent); }
  .toggle[aria-pressed="true"] .track::after { transform: translateX(12px); background: var(--on-accent); }
  .readout {
    font: 500 12px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    min-width: 9ch;
  }
  .error { margin: 0; max-width: 40ch; font: 400 13px/1.5 var(--mono); color: var(--fg); }

  @media (max-width: 560px) {
    .dock { width: 100%; padding: 10px; gap: 10px; }
    .group { flex-wrap: wrap; justify-content: center; }
    .group .label { width: 100%; text-align: center; }
    button { padding: 8px 9px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .track, .track::after { transition: none; }
  }
</style>

<div class="stage" id="stage"></div>

<div class="ui">
  <header class="title">
    <p class="eyebrow">Quadruped · 12 actuated joints</p>
    <h1>Robot Dog</h1>
    <p class="hint">Drag to rotate 360°. Scroll or pinch to zoom. Right-drag or two-finger drag to pan.</p>
    <p class="error" id="err" hidden>The 3D viewer needs Three.js from a CDN and it did not load. Check your connection and reload the page.</p>
  </header>

  <nav class="dock" aria-label="Viewer controls">
    <div class="group">
      <span class="label">Pose</span>
      <div class="seg" role="group" aria-label="Pose">
        <button type="button" id="pose-stand" data-pose="stand" aria-pressed="true">Stand</button>
        <button type="button" id="pose-sit" data-pose="sit" aria-pressed="false">Sit</button>
        <button type="button" id="pose-trot" data-pose="trot" aria-pressed="false">Trot</button>
      </div>
    </div>
    <div class="group">
      <span class="label">View</span>
      <div class="seg" role="group" aria-label="Camera view">
        <button type="button" id="view-front" data-view="front">Front</button>
        <button type="button" id="view-side" data-view="side">Side</button>
        <button type="button" id="view-rear" data-view="rear">Rear</button>
        <button type="button" id="view-top" data-view="top">Top</button>
        <button type="button" id="view-iso" data-view="iso">3/4</button>
      </div>
    </div>
    <div class="group">
      <button type="button" class="toggle" id="spin" aria-pressed="true"><span class="track" aria-hidden="true"></span>Auto-rotate</button>
      <span class="readout" id="az" aria-live="off">AZ 000°</span>
    </div>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  'use strict';
  if (!window.THREE || !THREE.OrbitControls) {
    document.getElementById('err').hidden = false;
    return;
  }
  var T = THREE;
  var TAU = Math.PI * 2;
  function col(hex) { return new T.Color(hex).convertSRGBToLinear(); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  /* ---------- Proportions (1 unit ≈ 1/100 of the body length in the reference renders) ---------- */
  var HIP_X = 2.8;      // hip pitch axis, fore/aft of body centre
  var HIP_Y = 4.9;      // hip height when standing
  var LEG_Z = 1.38;     // lateral offset of the leg plane
  var L1 = 3.4;         // thigh: hip axis to knee axis
  var L2 = 3.4;         // calf: knee axis to foot centre
  var FOOT_R = 0.28;

  /* ---------- Renderer, scene, camera ---------- */
  var stage = document.getElementById('stage');
  var renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.setClearColor(0x000000, 0);
  stage.appendChild(renderer.domElement);

  var scene = new T.Scene();
  var camera = new T.PerspectiveCamera(32, 1, 0.1, 200);
  var HOME_TARGET = new T.Vector3(-0.4, 2.7, 0);

  // Studio environment for reflections: a grey room with softbox panels, prefiltered once.
  (function studio() {
    var env = new T.Scene();
    var room = new T.Mesh(new T.BoxGeometry(40, 24, 40), new T.MeshBasicMaterial({ color: col(0x7d7d7b), side: T.BackSide }));
    room.position.y = 10;
    env.add(room);
    var floor = new T.Mesh(new T.PlaneGeometry(40, 40), new T.MeshBasicMaterial({ color: col(0x3a3a39) }));
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.9;
    env.add(floor);
    function box(w, h, x, y, z, ry, rx, k) {
      var m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: new T.Color(k, k, k), side: T.DoubleSide }));
      m.position.set(x, y, z);
      m.rotation.set(rx, ry, 0);
      env.add(m);
    }
    box(18, 4, 0, 21.5, 0, 0, Math.PI / 2, 3.2);
    box(8, 12, -19.5, 9, 5, Math.PI / 2, 0, 2.4);
    box(8, 12, 19.5, 9, -7, Math.PI / 2, 0, 1.5);
    box(14, 6, 2, 9, 19.5, 0, 0, 1.2);
    var pm = new T.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(env, 0.04).texture;
    pm.dispose();
  })();

  scene.add(new T.HemisphereLight(0xffffff, 0x8a8782, 0.35));
  var key = new T.DirectionalLight(0xffffff, 1.5);
  key.position.set(6, 15, 7);
  key.target.position.set(0, 2, 0);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -9;
  key.shadow.camera.right = 9;
  key.shadow.camera.top = 9;
  key.shadow.camera.bottom = -9;
  key.shadow.camera.near = 1;
  key.shadow.camera.far = 40;
  key.shadow.bias = -0.0004;
  key.shadow.normalBias = 0.03;
  scene.add(key, key.target);
  var rim = new T.DirectionalLight(0xdfe6ff, 0.45);
  rim.position.set(-8, 6, -9);
  scene.add(rim);

  /* ---------- Materials ---------- */
  function std(hex, rough, metal) {
    return new T.MeshStandardMaterial({ color: col(hex), roughness: rough, metalness: metal, side: T.DoubleSide });
  }
  var M = {
    shell: std(0xebe9e4, 0.42, 0.0),
    metal: std(0x9c9893, 0.32, 0.85),
    calf: std(0x8f8a84, 0.42, 0.72),
    bracket: std(0x5d5a56, 0.5, 0.55),
    rail: std(0x585652, 0.7, 0.2),
    core: std(0x2c2c2e, 0.75, 0.1),
    rubber: std(0x1d1d1f, 0.85, 0.0),
    screw: std(0x7b7975, 0.4, 0.6)
  };

  function mesh(geo, mat) {
    var m = new T.Mesh(geo, mat);
    m.castShadow = true;
    m.receiveShadow = true;
    return m;
  }
  function boxAt(w, h, d, x, y, z, mat, parent) {
    var m = mesh(new T.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z);
    parent.add(m);
    return m;
  }

  /* ---------- Geometry helpers ---------- */
  // Loft along +x through rounded-trapezoid sections {x, wt, wb, y0, y1, r} (wt/wb = top/bottom half-widths).
  function sectionRing(s, seg) {
    var r = s.r, pts = [];
    var corners = [
      [s.wt - r, s.y1 - r, 0],
      [-s.wt + r, s.y1 - r, Math.PI / 2],
      [-s.wb + r, s.y0 + r, Math.PI],
      [s.wb - r, s.y0 + r, Math.PI * 1.5]
    ];
    corners.forEach(function (c) {
      for (var i = 0; i <= seg; i++) {
        var a = c[2] + (i / seg) * Math.PI / 2;
        pts.push([s.x, c[1] + r * Math.sin(a), c[0] + r * Math.cos(a)]);
      }
    });
    return pts;
  }
  function loft(sections, mat, seg) {
    seg = seg || 6;
    var rings = sections.map(function (s) { return sectionRing(s, seg); });
    var n = rings[0].length, pos = [], idx = [];
    rings.forEach(function (ring) { ring.forEach(function (p) { pos.push(p[0], p[1], p[2]); }); });
    for (var i = 0; i < rings.length - 1; i++) {
      for (var j = 0; j < n; j++) {
        var j2 = (j + 1) % n;
        var a = i * n + j, b = i * n + j2, c = (i + 1) * n + j, d = (i + 1) * n + j2;
        idx.push(a, c, b, b, c, d);
      }
    }
    function cap(ring, last) {
      var base = pos.length / 3, cy = 0, cz = 0;
      ring.forEach(function (p) { cy += p[1]; cz += p[2]; });
      pos.push(ring[0][0], cy / n, cz / n);
      ring.forEach(function (p) { pos.push(p[0], p[1], p[2]); });
      for (var j = 0; j < n; j++) {
        var j2 = (j + 1) % n;
        if (last) idx.push(base, base + 1 + j2, base + 1 + j);
        else idx.push(base, base + 1 + j, base + 1 + j2);
      }
    }
    cap(rings[0], false);
    cap(rings[rings.length - 1], true);
    var g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return mesh(g, mat);
  }

  // Sweep an elliptical section along a curve in the XY plane; radii(t) returns [in-plane, through-plane].
  function sweep(points, radii, mat, segs, radial) {
    segs = segs || 56;
    radial = radial || 22;
    var curve = new T.CatmullRomCurve3(points.map(function (p) { return new T.Vector3(p[0], p[1], 0); }));
    var pos = [], idx = [];
    for (var i = 0; i <= segs; i++) {
      var t = i / segs, c = curve.getPointAt(t), tg = curve.getTangentAt(t), rr = radii(t);
      var nx = -tg.y, ny = tg.x;
      for (var j = 0; j < radial; j++) {
        var ph = (j / radial) * TAU;
        pos.push(c.x + nx * rr[0] * Math.cos(ph), c.y + ny * rr[0] * Math.cos(ph), rr[1] * Math.sin(ph));
      }
    }
    for (i = 0; i < segs; i++) {
      for (j = 0; j < radial; j++) {
        var j2 = (j + 1) % radial;
        var a = i * radial + j, b = i * radial + j2, cc = (i + 1) * radial + j, d = (i + 1) * radial + j2;
        idx.push(a, b, cc, b, d, cc);
      }
    }
    var g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return mesh(g, mat);
  }

  // Actuator housing along +y from 0 to len, with a machined groove.
  function motorGeo(r, len) {
    var e = 0.05, g0 = len * 0.34, g1 = len * 0.42;
    var p = [[0, 0], [r - e, 0], [r, e], [r, g0], [r - 0.035, g0 + 0.02], [r - 0.035, g1 - 0.02], [r, g1],
      [r, len - e], [r - e, len], [0, len]];
    return new T.LatheGeometry(p.map(function (q) { return new T.Vector2(q[0], q[1]); }), 44);
  }
  function capGeo(r) {
    var p = [[0, 0], [r + 0.01, 0], [r + 0.01, 0.09], [r - 0.03, 0.19], [r - 0.14, 0.25], [0, 0.265]];
    return new T.LatheGeometry(p.map(function (q) { return new T.Vector2(q[0], q[1]); }), 44);
  }

  function roundedTrap(wt, wb, y0, y1, r) {
    var f = r / (y1 - y0), s = new T.Shape();
    s.moveTo(-wb + r, y0);
    s.lineTo(wb - r, y0);
    s.quadraticCurveTo(wb, y0, wb + (wt - wb) * f, y0 + r);
    s.lineTo(wt - (wt - wb) * f, y1 - r);
    s.quadraticCurveTo(wt, y1, wt - r, y1);
    s.lineTo(-wt + r, y1);
    s.quadraticCurveTo(-wt, y1, -wt + (wt - wb) * f, y1 - r);
    s.lineTo(-wb - (wt - wb) * f, y0 + r);
    s.quadraticCurveTo(-wb, y0, -wb + r, y0);
    return s;
  }
  function fitUV(geo) {
    geo.computeBoundingBox();
    var bb = geo.boundingBox, p = geo.attributes.position, uv = geo.attributes.uv;
    for (var i = 0; i < p.count; i++) {
      uv.setXY(i, (p.getX(i) - bb.min.x) / (bb.max.x - bb.min.x), (p.getY(i) - bb.min.y) / (bb.max.y - bb.min.y));
    }
    uv.needsUpdate = true;
    return geo;
  }
  function canvasTex(w, h, draw) {
    var c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    draw(c.getContext('2d'), w, h);
    var t = new T.CanvasTexture(c);
    t.encoding = T.sRGBEncoding;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  function rrect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  /* ---------- Textures ---------- */
  var visorTex = canvasTex(1024, 640, function (g, w, h) {
    var bg = g.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#2b2c31');
    bg.addColorStop(0.45, '#0d0d10');
    bg.addColorStop(1, '#050506');
    g.fillStyle = bg;
    g.fillRect(0, 0, w, h);
    var sheen = g.createLinearGradient(0, 0, w, h);
    sheen.addColorStop(0.0, 'rgba(255,255,255,0.10)');
    sheen.addColorStop(0.35, 'rgba(255,255,255,0.0)');
    g.fillStyle = sheen;
    g.fillRect(0, 0, w, h);
    [225, 799].forEach(function (x) {
      var y = 400, R = 62;
      g.fillStyle = '#1e1e23';
      g.beginPath(); g.arc(x, y, R * 1.25, 0, TAU); g.fill();
      var glass = g.createRadialGradient(x - R * 0.3, y - R * 0.3, R * 0.05, x, y, R);
      glass.addColorStop(0, '#6b5aa3');
      glass.addColorStop(0.35, '#2a2240');
      glass.addColorStop(1, '#060608');
      g.fillStyle = glass;
      g.beginPath(); g.arc(x, y, R, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.55)';
      g.beginPath(); g.ellipse(x - R * 0.36, y - R * 0.4, R * 0.2, R * 0.12, -0.6, 0, TAU); g.fill();
    });
    g.strokeStyle = '#f1f1f1';
    g.lineWidth = 15;
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.beginPath();
    g.moveTo(442, 100); g.lineTo(478, 136); g.lineTo(512, 108); g.lineTo(546, 136); g.lineTo(582, 100);
    g.stroke();
  });

  var sideTex = canvasTex(1024, 548, function (g, w, h) {
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, w, h);
    g.fillStyle = '#b8b6b1';
    [250, 430, 600, 780].forEach(function (x) { g.beginPath(); g.arc(x, 44, 5, 0, TAU); g.fill(); });
    var px = 512 - 330, py = 220, pw = 660, ph = 270;
    g.fillStyle = '#dcdad5';
    rrect(g, px, py, pw, ph, 26); g.fill();
    g.strokeStyle = '#c3c1bb'; g.lineWidth = 8;
    rrect(g, px + 4, py + 4, pw - 8, ph - 8, 22); g.stroke();
    g.strokeStyle = '#f2f1ee'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(px + 26, py + ph - 2); g.lineTo(px + pw - 26, py + ph - 2); g.stroke();
    [512 - 210, 512 + 210].forEach(function (cx) {
      g.fillStyle = '#f4f3f0';
      rrect(g, cx - 58, py + 72, 116, 128, 14); g.fill();
      g.strokeStyle = '#bebcb6'; g.lineWidth = 4;
      rrect(g, cx - 58, py + 72, 116, 128, 14); g.stroke();
      var pit = g.createLinearGradient(0, py + 92, 0, py + 180);
      pit.addColorStop(0, '#2a2a2b'); pit.addColorStop(1, '#4a4947');
      g.fillStyle = pit;
      rrect(g, cx - 34, py + 94, 68, 84, 8); g.fill();
    });
    g.strokeStyle = '#8e8c87'; g.lineWidth = 8;
    g.beginPath(); g.arc(512, py + 118, 34, 0, TAU); g.stroke();
    g.fillStyle = '#8e8c87';
    [-45, -15, 15, 45].forEach(function (dx) { g.beginPath(); g.arc(512 + dx, py + 192, 5.5, 0, TAU); g.fill(); });
  });

  var tableTex = canvasTex(1024, 1024, function (g, w) {
    var c = w / 2;
    g.translate(c, c);
    g.strokeStyle = 'rgba(120,120,124,0.55)';
    g.lineWidth = 3;
    g.beginPath(); g.arc(0, 0, 482, 0, TAU); g.stroke();
    g.strokeStyle = 'rgba(120,120,124,0.18)';
    g.lineWidth = 2;
    g.beginPath(); g.arc(0, 0, 330, 0, TAU); g.stroke();
    for (var d = 0; d < 360; d += 5) {
      var a = d * Math.PI / 180, major = d % 45 === 0;
      g.strokeStyle = major ? 'rgba(120,120,124,0.7)' : 'rgba(120,120,124,0.35)';
      g.lineWidth = major ? 4 : 2;
      var r0 = major ? 440 : 462;
      g.beginPath(); g.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); g.lineTo(Math.cos(a) * 482, Math.sin(a) * 482); g.stroke();
    }
    g.fillStyle = 'rgba(58,82,196,0.85)';
    g.beginPath(); g.moveTo(500, 0); g.lineTo(470, -16); g.lineTo(470, 16); g.closePath(); g.fill();
  });

  var blobTex = canvasTex(256, 256, function (g, w) {
    var gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    gr.addColorStop(0, 'rgba(0,0,0,0.5)');
    gr.addColorStop(0.55, 'rgba(0,0,0,0.18)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, w, w);
  });

  /* ---------- Ground ---------- */
  var shadowFloor = new T.Mesh(new T.CircleGeometry(30, 64), new T.ShadowMaterial({ opacity: 0.2 }));
  shadowFloor.rotation.x = -Math.PI / 2;
  shadowFloor.receiveShadow = true;
  scene.add(shadowFloor);
  var table = new T.Mesh(new T.CircleGeometry(6.6, 96), new T.MeshBasicMaterial({ map: tableTex, transparent: true, depthWrite: false }));
  table.rotation.x = -Math.PI / 2;
  table.position.y = 0.004;
  scene.add(table);
  var blob = new T.Mesh(new T.PlaneGeometry(11, 5.4), new T.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false, opacity: 0.6 }));
  blob.rotation.x = -Math.PI / 2;
  blob.position.set(-0.4, 0.008, 0);
  scene.add(blob);

  /* ---------- Robot body ---------- */
  var robot = new T.Group();
  var pivot = new T.Group();   // moves and pitches the torso
  var content = new T.Group(); // body parts authored in standing coordinates (ground at y = 0)
  content.position.y = -HIP_Y;
  pivot.add(content);
  robot.add(pivot);
  scene.add(robot);

  // Top shell: chamfered rear, flat deck, tapering neck that rises toward the head.
  content.add(loft([
    { x: -3.72, wt: 0.6, wb: 0.6, y0: 5.69, y1: 6.02, r: 0.12 },
    { x: -3.64, wt: 0.72, wb: 0.72, y0: 5.66, y1: 6.08, r: 0.15 },
    { x: -3.3, wt: 1.05, wb: 1.05, y0: 5.65, y1: 6.1, r: 0.16 },
    { x: 0.5, wt: 1.05, wb: 1.05, y0: 5.65, y1: 6.1, r: 0.16 },
    { x: 1.3, wt: 0.84, wb: 0.8, y0: 5.73, y1: 6.2, r: 0.18 },
    { x: 2.2, wt: 0.67, wb: 0.64, y0: 5.8, y1: 6.32, r: 0.18 },
    { x: 2.6, wt: 0.67, wb: 0.64, y0: 5.82, y1: 6.34, r: 0.18 }
  ], M.shell));

  // Head: sensor module with a trapezoid face.
  content.add(loft([
    { x: 2.45, wt: 0.66, wb: 0.6, y0: 5.5, y1: 6.36, r: 0.2 },
    { x: 2.75, wt: 0.8, wb: 0.7, y0: 5.22, y1: 6.42, r: 0.22 },
    { x: 3.5, wt: 0.82, wb: 0.72, y0: 5.18, y1: 6.42, r: 0.22 },
    { x: 3.62, wt: 0.8, wb: 0.7, y0: 5.21, y1: 6.39, r: 0.2 },
    { x: 3.68, wt: 0.76, wb: 0.66, y0: 5.26, y1: 6.34, r: 0.17 }
  ], M.shell));
  var bezel = new T.Mesh(new T.ShapeGeometry(roundedTrap(0.67, 0.58, -0.43, 0.43, 0.12), 8), std(0x8d8b87, 0.5, 0.2));
  bezel.rotation.y = Math.PI / 2;
  bezel.position.set(3.683, 5.8, 0);
  content.add(bezel);
  var visor = new T.Mesh(fitUV(new T.ShapeGeometry(roundedTrap(0.64, 0.55, -0.4, 0.4, 0.1), 8)),
    new T.MeshStandardMaterial({ map: visorTex, roughness: 0.12, metalness: 0.15 }));
  visor.rotation.y = Math.PI / 2;
  visor.position.set(3.687, 5.8, 0);
  content.add(visor);

  // Main battery/electronics box with side panels.
  content.add(loft([
    { x: -2.45, wt: 0.97, wb: 0.97, y0: 3.9, y1: 5.68, r: 0.1 },
    { x: -2.4, wt: 1.0, wb: 1.0, y0: 3.85, y1: 5.7, r: 0.12 },
    { x: 0.6, wt: 1.0, wb: 1.0, y0: 3.85, y1: 5.7, r: 0.12 },
    { x: 0.65, wt: 0.97, wb: 0.97, y0: 3.9, y1: 5.68, r: 0.1 }
  ], M.shell));
  [1, -1].forEach(function (side) {
    var p = new T.Mesh(new T.PlaneGeometry(2.9, 1.55), new T.MeshStandardMaterial({ map: sideTex, color: M.shell.color, roughness: 0.45 }));
    p.position.set(-0.9, 4.775, side * 1.004);
    if (side < 0) p.rotation.y = Math.PI;
    p.receiveShadow = true;
    content.add(p);
  });

  // Deck rails.
  [0.38, -0.38].forEach(function (z) { boxAt(3.4, 0.1, 0.13, -1.3, 6.15, z, M.rail, content); });

  // Belly tray and pads.
  boxAt(5.6, 0.18, 1.56, -0.5, 3.81, 0, M.bracket, content);
  [[1.7, 0.45], [1.7, -0.45], [-2.6, 0.45], [-2.6, -0.45]].forEach(function (p) {
    boxAt(0.32, 0.12, 0.3, p[0], 3.66, p[1], M.core, content);
  });

  // Exposed front and rear bays.
  boxAt(1.8, 1.8, 0.62, 1.5, 4.8, 0, M.core, content);
  boxAt(1.05, 1.75, 0.62, -2.9, 4.78, 0, M.core, content);
  // Head yoke (front) and rear frame.
  [0.24, -0.24].forEach(function (z) {
    boxAt(0.2, 1.5, 0.14, 2.55, 4.95, z, M.bracket, content);
    boxAt(0.16, 1.45, 0.14, -3.5, 4.93, z, M.bracket, content);
  });
  boxAt(0.2, 0.18, 0.62, 2.55, 4.25, 0, M.bracket, content);
  boxAt(0.16, 0.18, 0.62, -3.5, 4.25, 0, M.bracket, content);
  boxAt(0.5, 0.12, 0.62, 2.55, 5.68, 0, M.bracket, content);

  /* ---------- Hips and legs ---------- */
  var legs = [];
  var thighGeo = (function () {
    var R = 0.54, r = 0.32, s = (R - r) / L1, c = Math.sqrt(1 - s * s), as = Math.asin(s);
    var sh = new T.Shape();
    sh.moveTo(R * c, -R * s);
    sh.lineTo(r * c, -L1 - r * s);
    sh.absarc(0, -L1, r, -as, -Math.PI + as, true);
    sh.lineTo(-R * c, -R * s);
    sh.absarc(0, 0, R, Math.PI + as, -as, true);
    return new T.ExtrudeGeometry(sh, { depth: 0.22, bevelEnabled: true, bevelThickness: 0.07, bevelSize: 0.06, bevelSegments: 5, curveSegments: 32 });
  })();
  var calfPts = [[0, 0], [0.08, -0.85], [0.2, -1.75], [0.27, -2.5], [0.19, -3.05], [0, -L2]];
  var linkGeo = (function () {
    var sh = new T.Shape();
    sh.moveTo(-0.3, 0.12); sh.lineTo(0.3, 0.12); sh.lineTo(0.24, -0.78); sh.lineTo(-0.04, -0.78); sh.closePath();
    return new T.ExtrudeGeometry(sh, { depth: 0.14, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 2 });
  })();

  function cable(points, parent) {
    var curve = new T.CubicBezierCurve3(points[0], points[1], points[2], points[3]);
    parent.add(mesh(new T.TubeGeometry(curve, 24, 0.032, 8, false), M.metal));
  }

  function buildLeg(front, side) {
    var hx = front ? HIP_X : -HIP_X;
    var dir = front ? 1 : -1;

    // Hip roll actuator, axis along the body, capped at the outer end.
    var roll = new T.Group();
    roll.position.set(front ? 1.55 : -2.0, HIP_Y, side * 0.56);
    roll.rotation.z = -dir * Math.PI / 2;
    var rollLen = front ? 1.6 : 1.35;
    roll.add(mesh(motorGeo(0.42, rollLen), M.metal));
    var cap = mesh(capGeo(0.42), front ? M.shell : M.bracket);
    cap.position.y = rollLen;
    roll.add(cap);
    content.add(roll);
    cable([
      new T.Vector3(front ? 0.7 : -2.2, 5.3, side * 0.35),
      new T.Vector3(front ? 1.3 : -2.5, 5.75, side * 0.6),
      new T.Vector3(hx - dir * 0.6, 5.7, side * 0.85),
      new T.Vector3(hx - dir * 0.2, 5.38, side * 0.98)
    ], content);

    // Yoke from roll actuator to the hip pitch actuator.
    boxAt(0.78, 0.92, 0.3, hx + dir * 0.05, HIP_Y, side * 0.86, M.bracket, content);

    var hip = new T.Group();
    hip.position.set(hx, HIP_Y, 0);
    content.add(hip);
    var pitch = mesh(motorGeo(0.5, 0.36), M.metal);
    pitch.position.z = side * 0.9;
    pitch.rotation.x = side * Math.PI / 2;
    hip.add(pitch);

    var thigh = new T.Group();
    hip.add(thigh);
    var shell = mesh(thighGeo, M.shell);
    shell.position.z = side * LEG_Z - 0.11;
    thigh.add(shell);
    [[0.36, -0.3], [0.29, -1.25], [0.21, -2.25], [0.14, -3.1]].forEach(function (p) {
      var s = mesh(new T.CylinderGeometry(0.04, 0.04, 0.02, 12), M.screw);
      s.rotation.x = Math.PI / 2;
      s.position.set(p[0], p[1], side * (LEG_Z + 0.185));
      thigh.add(s);
    });
    var hub = mesh(new T.CylinderGeometry(0.27, 0.27, 0.34, 28), M.bracket);
    hub.rotation.x = Math.PI / 2;
    hub.position.set(0, -L1, side * LEG_Z);
    thigh.add(hub);

    var knee = new T.Group();
    knee.position.y = -L1;
    thigh.add(knee);
    var calf = sweep(calfPts, function (t) {
      var w = t < 0.75 ? 0.27 - t * 0.12 : 0.18 - (t - 0.75) * 0.08;
      var d = 0.15 - t * 0.04;
      return [w, d];
    }, M.calf);
    calf.position.z = side * (LEG_Z - 0.04);
    knee.add(calf);
    var link = mesh(linkGeo, M.bracket);
    link.position.z = side * (LEG_Z - 0.04) - 0.07;
    knee.add(link);
    var foot = mesh(new T.SphereGeometry(FOOT_R, 28, 18), M.rubber);
    foot.scale.set(1.05, 1.2, 0.95);
    foot.position.set(0, -L2 + 0.04, side * (LEG_Z - 0.04));
    knee.add(foot);
    var collar = mesh(new T.CylinderGeometry(0.2, 0.25, 0.12, 24), M.rubber);
    collar.position.set(0.03, -L2 + 0.32, side * (LEG_Z - 0.04));
    knee.add(collar);

    legs.push({
      front: front, side: side, thigh: thigh, knee: knee,
      hip: new T.Vector3(hx, HIP_Y, 0),
      pair: (front ? side : -side) > 0 ? 0 : 1
    });
  }
  buildLeg(true, 1);
  buildLeg(true, -1);
  buildLeg(false, 1);
  buildLeg(false, -1);

  // Two-link IK in the leg plane; knees bend backward like the reference robot.
  function solveLeg(leg, dx, dy) {
    var d = clamp(Math.hypot(dx, dy), 0.8, L1 + L2 - 0.001);
    var phi = Math.atan2(dx, -dy);
    var alpha = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
    var gamma = Math.acos(clamp((L1 * L1 + L2 * L2 - d * d) / (2 * L1 * L2), -1, 1));
    leg.thigh.rotation.z = phi - alpha;
    leg.knee.rotation.z = Math.PI - gamma;
  }

  /* ---------- Poses ---------- */
  var POSES = {
    stand: { y: HIP_Y, pitch: 0, fx: 2.75, rx: -2.8, gait: 0 },
    sit: { y: 3.45, pitch: 0.35, fx: 2.45, rx: -2.4, gait: 0 },
    trot: { y: 4.72, pitch: 0, fx: 2.75, rx: -2.8, gait: 1 }
  };
  var cur = Object.assign({}, POSES.stand);
  var goal = POSES.stand;
  var gaitPhase = 0;
  var foot = new T.Vector3();

  function updateRobot(dt, t) {
    var k = 1 - Math.exp(-dt * 3.2);
    Object.keys(cur).forEach(function (key) { cur[key] += (goal[key] - cur[key]) * k; });
    gaitPhase = (gaitPhase + dt * TAU * 1.6) % TAU;
    var breathe = Math.sin(t * 1.7) * 0.035 * (1 - cur.gait);
    var bob = Math.cos(gaitPhase * 2) * 0.06 * cur.gait;
    pivot.position.y = cur.y + breathe + bob;
    pivot.rotation.z = cur.pitch + Math.sin(gaitPhase) * 0.012 * cur.gait;
    pivot.rotation.x = Math.sin(gaitPhase) * 0.02 * cur.gait;
    robot.updateMatrixWorld(true);
    legs.forEach(function (leg) {
      var fx = leg.front ? cur.fx : cur.rx, fy = FOOT_R;
      if (cur.gait > 0.001) {
        var p = (gaitPhase + leg.pair * Math.PI) % TAU;
        fx -= Math.cos(p) * 0.45 * cur.gait;
        if (p < Math.PI) fy += Math.sin(p) * 0.55 * cur.gait;
      }
      foot.set(fx, fy, leg.side * LEG_Z);
      content.worldToLocal(foot);
      solveLeg(leg, foot.x - leg.hip.x, foot.y - leg.hip.y);
    });
  }

  /* ---------- Camera controls ---------- */
  var controls = new T.OrbitControls(camera, renderer.domElement);
  controls.target.copy(HOME_TARGET);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 7;
  controls.maxDistance = 34;
  controls.maxPolarAngle = Math.PI * 0.94;
  controls.autoRotateSpeed = 1.4;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  controls.autoRotate = !reduceMotion;

  var VIEWS = {
    front: [0, 1.38],
    side: [Math.PI / 2, 1.38],
    rear: [Math.PI, 1.38],
    top: [Math.PI / 2, 0.06],
    iso: [0.8, 1.12]
  };
  var HOME_DIST = 25;
  // Spherical angles: theta measured from +x (the robot's front) toward +z; phi from straight up.
  function placeCamera(theta, phi, dist, target) {
    camera.position.set(
      target.x + dist * Math.sin(phi) * Math.cos(theta),
      target.y + dist * Math.cos(phi),
      target.z + dist * Math.sin(phi) * Math.sin(theta)
    );
    camera.lookAt(target);
  }
  placeCamera(VIEWS.iso[0], VIEWS.iso[1], HOME_DIST, HOME_TARGET);

  var tween = null;
  function goView(name) {
    var v = camera.position.clone().sub(controls.target);
    var dist = v.length();
    var theta0 = Math.atan2(v.z, v.x);
    var phi0 = Math.acos(clamp(v.y / dist, -1, 1));
    var theta1 = VIEWS[name][0];
    var dTheta = ((theta1 - theta0 + Math.PI) % TAU + TAU) % TAU - Math.PI;
    tween = {
      t: 0, theta0: theta0, dTheta: dTheta, phi0: phi0, phi1: VIEWS[name][1],
      d0: dist, d1: name === 'top' ? 28 : HOME_DIST,
      tg0: controls.target.clone(), tg1: HOME_TARGET.clone()
    };
  }
  controls.addEventListener('start', function () { tween = null; });

  function stepTween(dt) {
    if (!tween) return;
    tween.t = Math.min(1, tween.t + dt / (reduceMotion ? 0.01 : 0.9));
    var e = tween.t < 0.5 ? 4 * tween.t * tween.t * tween.t : 1 - Math.pow(-2 * tween.t + 2, 3) / 2;
    controls.target.lerpVectors(tween.tg0, tween.tg1, e);
    placeCamera(tween.theta0 + tween.dTheta * e, tween.phi0 + (tween.phi1 - tween.phi0) * e,
      tween.d0 + (tween.d1 - tween.d0) * e, controls.target);
    if (tween.t >= 1) tween = null;
  }

  /* ---------- UI ---------- */
  var poseButtons = document.querySelectorAll('[data-pose]');
  poseButtons.forEach(function (b) {
    b.addEventListener('click', function () {
      goal = POSES[b.dataset.pose];
      poseButtons.forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
    });
  });
  document.querySelectorAll('[data-view]').forEach(function (b) {
    b.addEventListener('click', function () { goView(b.dataset.view); });
  });
  var spin = document.getElementById('spin');
  function syncSpin() { spin.setAttribute('aria-pressed', String(controls.autoRotate)); }
  spin.addEventListener('click', function () { controls.autoRotate = !controls.autoRotate; syncSpin(); });
  syncSpin();
  var az = document.getElementById('az');
  var lastAz = -1;
  function updateReadout() {
    var v = camera.position.clone().sub(controls.target);
    var deg = Math.round(((Math.atan2(v.z, v.x) * 180 / Math.PI) % 360 + 360) % 360) % 360;
    if (deg !== lastAz) {
      lastAz = deg;
      az.textContent = 'AZ ' + String(deg).padStart(3, '0') + '°';
    }
  }

  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // Pull back a little on tall, narrow screens so the whole robot fits.
    camera.fov = w / h < 0.8 ? 46 : 32;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  var clock = new T.Clock();
  var elapsed = 0;
  renderer.setAnimationLoop(function () {
    var dt = Math.min(clock.getDelta(), 0.05);
    elapsed += dt;
    updateRobot(dt, elapsed);
    if (tween) stepTween(dt);
    else controls.update();
    updateReadout();
    renderer.render(scene, camera);
  });
})();
</script>
